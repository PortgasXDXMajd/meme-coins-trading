[project]
name = "memecoin-desk"
version = "0.1.0"
description = "Six-agent Solana memecoin desk with a devil's advocate debate before every buy"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "solders>=0.21",
    "streamlit>=1.40",
]

[project.scripts]
desk = "desk.main:cli"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
